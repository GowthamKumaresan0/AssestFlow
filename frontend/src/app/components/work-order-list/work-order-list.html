<div class="flex h-screen bg-slate-50 overflow-hidden">
  <div class="flex-1 flex flex-col overflow-hidden">
    <main class="flex-1 overflow-y-auto p-6 md:p-8 relative">
      <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Work Orders</h1>
          <div class="flex gap-4">
            <button routerLink="/dashboard" class="px-4 py-2 bg-slate-200 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-300 transition">Dashboard</button>
            <button (click)="openModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-md shadow-indigo-200 transition">+ New Work Order</button>
          </div>
        </div>
        
        <div *ngIf="error" class="mb-4 p-4 bg-rose-50 text-rose-600 rounded-lg border border-rose-200">
          {{ error }}
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">ID</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Title</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Priority</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr *ngIf="workOrders.length === 0">
                <td colspan="4" class="px-6 py-8 text-center text-slate-500">No work orders found. Create one!</td>
              </tr>
              <tr *ngFor="let order of workOrders" class="hover:bg-slate-50 transition">
                <td class="px-6 py-4 text-sm font-medium text-indigo-600">#{{ order.id }}</td>
                <td class="px-6 py-4 text-sm text-slate-700">{{ order.title }}</td>
                <td class="px-6 py-4 text-sm text-slate-500">{{ order.priority }}</td>
                <td class="px-6 py-4 text-sm">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">
                    {{ order.status }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal overlay -->
    <div *ngIf="showModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
          <h2 class="text-xl font-bold text-slate-800">Create Work Order</h2>
          <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="p-6">
          <form (ngSubmit)="submitOrder()" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
              <input type="text" [(ngModel)]="newOrder.title" name="title" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
              <textarea [(ngModel)]="newOrder.description" name="description" rows="3" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Priority</label>
                <select [(ngModel)]="newOrder.priority" name="priority" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM">Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                <input type="date" [(ngModel)]="newOrder.dueDate" name="dueDate" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
            </div>
            <div class="pt-4 flex gap-3">
              <button type="button" (click)="closeModal()" class="flex-1 px-4 py-2 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition">Cancel</button>
              <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 shadow-md shadow-indigo-200 transition">Create Order</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
