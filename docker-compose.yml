version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: assetflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/assetflow_db
      - SPRING_DATASOURCE_USERNAME=assetflow
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
